name: Trial full-history Pages artifact deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-pages-publish
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Validate snapshot preparation
        run: uv run --no-project python -m unittest discover -s .github/scripts -p 'test_pages_artifact_trial.py' -v
      - name: Read complete upstream published snapshot
        env:
          SNAPSHOT_SHA: 3f8c1641e65e40d49ed1f1adbcd97cf0aacbc348
        run: |
          set -euo pipefail
          git clone --depth=1 --single-branch --branch gh-pages \
            https://github.com/datajuicer/data-juicer.git "$RUNNER_TEMP/source-site"
          test "$(git -C "$RUNNER_TEMP/source-site" rev-parse HEAD)" = "$SNAPSHOT_SHA"
      - name: Prepare every published version without build caches
        env:
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          uv run --no-project python .github/scripts/pages_artifact_trial.py \
            "$RUNNER_TEMP/source-site" "$RUNNER_TEMP/publish-site" \
            --base-url "$PAGES_BASE_URL" --report "$RUNNER_TEMP/snapshot-report.json"
      - name: Retain snapshot measurement
        uses: actions/upload-artifact@v4
        with:
          name: full-history-site-measurement
          path: ${{ runner.temp }}/snapshot-report.json
          retention-days: 14
      - name: Upload complete Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/publish-site

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reject changed trial branch
        uses: actions/github-script@v7
        with:
          script: |
            const ref = context.ref.replace(/^refs\//, '');
            const result = await github.rest.git.getRef({...context.repo, ref});
            if (result.data.object.sha !== context.sha) core.setFailed('Trial branch changed');
      - name: Deploy complete upstream snapshot to fork Pages
        id: deployment
        uses: actions/deploy-pages@v4
